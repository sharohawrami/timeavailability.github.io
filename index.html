/* Layout: an application form on black, in one language at a time. Logo and language button, how-it-works steps, the week as a days-by-hours table, then name, notes and Submit. */
:root {
  --bg: #000000;
  --surface: #0D1211;
  --ink: #F1F5F4;
  --muted: #9BA9A6;
  --line: #27302E;
  --cell: #19211F;
  --cell-hover: #28352F;
  --free: #34C6A6;
  --free-ink: #04211B;
  --warn: #F0C36A;
  --font-en: "Poppins", "Aria", "Segoe UI", Tahoma, sans-serif;
  --font-ku: "AI Kurd Digits", "Aria", "Poppins", Tahoma, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-en);
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 24px 56px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  font-family: var(--font-en);
}
.wrap.ku { font-family: var(--font-ku); line-height: 1.85; }
.en { font-family: var(--font-en); }
.kufont { font-family: var(--font-ku); }
h1, h2 { font-family: inherit; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.25; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; line-height: 1.5; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.87rem; }

/* header */
.top { display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
.brand .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.logo { display: block; max-height: 84px; max-width: 55%; width: auto; }
.wordmark { font-family: var(--font-en); font-weight: 700; font-size: 1.5rem; }

/* buttons and fields */
button, input, select, textarea { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 15px; border-radius: 8px; font-weight: 500; cursor: pointer; line-height: 1.4;
  text-decoration: none; display: inline-block; text-align: center;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--free); border-color: var(--free); color: var(--free-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.big { padding: 13px 34px; font-size: 1.05rem; }
.btn.link { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--free); font-weight: 600; }
.btn:disabled { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

section { display: flex; flex-direction: column; gap: 14px; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 14px;
}
.panel.done { border-color: var(--free); }
.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.flabel { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type="text"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
}
.edit input[type="text"], .edit select, .edit textarea { background: var(--bg); }
textarea { resize: vertical; min-height: 6.5em; line-height: 1.6; }
input[type="file"] { max-width: 100%; }

.status { min-height: 1.5em; color: var(--muted); font-size: 0.9rem; display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.status:empty { display: none; }
.status.hold:empty { display: flex; }
.status.alert { color: var(--warn); }

/* how it works */
.how ol { margin: 0; padding-inline-start: 1.5em; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.how li::marker { color: var(--free); font-weight: 600; }

/* the week table */
.legend { display: flex; align-items: center; gap: 8px; font-size: 0.87rem; color: var(--muted); }
.legend i { width: 16px; height: 16px; border-radius: 4px; background: var(--free); display: inline-block; flex: none; }
.total { font-weight: 700; font-size: 1.05rem; }
table.grid {
  width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 2px;
  font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none;
}
table.grid col.hours { width: 3.6rem; }
table.grid th, table.grid td { padding: 0; font-weight: 500; }
table.grid thead th {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-bottom: 4px; vertical-align: bottom;
}
.dayhead, .hourhead { width: 100%; border: 0; background: none; cursor: pointer; border-radius: 6px; padding: 6px 2px; }
.dayhead { font-weight: 600; font-size: 0.92rem; line-height: 1.5; white-space: nowrap; overflow: hidden; }
.dayhead .short { display: none; }
.dayhead:hover, .hourhead:hover { background: var(--cell); }
.dayhead[aria-pressed="true"] { color: var(--free); }
.hourhead { font-family: var(--font-en); font-size: 0.78rem; line-height: 1.5; color: var(--muted); text-align: right; padding: 0 6px 0 0; white-space: nowrap; }
.wrap.ku .hourhead { text-align: left; padding: 0 0 0 6px; }
tr.cut > th, tr.cut > td { padding-top: 7px; }
tr.cut .hourhead { color: var(--ink); font-weight: 600; }
.cell {
  display: block; width: 100%; height: 32px; border: 0; border-radius: 5px;
  background: var(--cell); cursor: pointer; touch-action: manipulation;
}
table.grid.half .cell { height: 21px; }
.cell:hover { background: var(--cell-hover); }
.cell[aria-pressed="true"] { background: var(--free); }
.cell[aria-pressed="true"]:hover { filter: brightness(1.12); }
table.grid tfoot th, table.grid tfoot td { padding-top: 8px; text-align: center; font-size: 0.85rem; color: var(--muted); }
table.grid tfoot td { font-family: var(--font-en); }
table.grid tfoot th { text-align: end; padding-inline-end: 6px; font-size: 0.75rem; }
table.grid tfoot td.has { color: var(--ink); font-weight: 600; }

/* edit panel */
.edit { border-color: var(--muted); font-family: var(--font-en); line-height: 1.55; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.formgrid .wide { grid-column: 1 / -1; }
.logoprev { max-height: 56px; max-width: 220px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }

@media (max-width: 700px) {
  .dayhead { font-size: 0.8rem; }
  .wrap.ku .dayhead { font-size: 0.62rem; }
  .dayhead .full { display: none; }
  .dayhead .short { display: inline; }
  table.grid col.hours { width: 3.2rem; }
  .hourhead { font-size: 0.72rem; padding-right: 4px; }
  .wrap.ku .hourhead { padding: 0 0 0 4px; }
  .panel { padding: 14px; }
  .btn.big { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .cell, .btn { transition: background-color 0.12s, border-color 0.12s; }
}

  function dayUnits(d) {
    var n = 0, u;
    for (u = firstUnit(); u < lastUnit(); u++) if (free.has(d * 48 + u)) n++;
    return n;
  }
  function totalUnits() { return weekOrder().reduce(function (s, d) { return s + dayUnits(d); }, 0); }
  function rangesText(d) {
    var out = [], start = -1, u;
    for (u = firstUnit(); u <= lastUnit(); u++) {
      var on = u < lastUnit() && free.has(d * 48 + u);
      if (on && start < 0) start = u;
      if (!on && start >= 0) { out.push(fmt(start) + ' – ' + fmt(u)); start = -1; }
    }
    return out.join(', ');
  }

  /* ---------- state for this view ---------- */

  var undoSnapshot = null;

  function bulk(fn) { undoSnapshot = new Set(free); fn(); refresh(); }

  function buildGrid() {
    var order = weekOrder(), s = step(), u;
    var table = h('table', { class: 'grid' + (s === 1 ? ' half' : ''), 'aria-label': t('Your free hours, by day and hour', 'کاتە بەتاڵەکانت بەپێی ڕۆژ و کاتژمێر') });
    var cg = h('colgroup', null, h('col', { class: 'hours' }));
    order.forEach(function () { cg.appendChild(h('col')); });
    table.appendChild(cg);

    var hr = h('tr', null, h('th', null));
    order.forEach(function (d) {
      hr.appendChild(h('th', { scope: 'col' },
        h('button', { class: 'dayhead', type: 'button', 'data-day': String(d), 'aria-pressed': 'false', 'aria-label': dayName(d) },
          h('span', { class: 'full', text: dayName(d) }),
          h('span', { class: 'short', text: dayShort(d) }))));
    });
    table.appendChild(h('thead', null, hr));

    var body = h('tbody');
    for (u = firstUnit(); u < lastUnit(); u += s) {
      var cut = u !== firstUnit() && (u === 24 || u === 36);
      var tr = h('tr', { class: cut ? 'cut' : null });
      tr.appendChild(h('th', { scope: 'row' },
        h('button', {
          class: 'hourhead', type: 'button', dir: 'ltr', 'data-unit': String(u),
          'aria-label': fmt(u) + t(', every day', '، هەموو ڕۆژەکان'),
          text: (u % 2 === 0) ? fmt(u) : '·'
        })));
      order.forEach(function (d) {
        tr.appendChild(h('td', null, h('button', {
          class: 'cell', type: 'button', 'data-day': String(d), 'data-unit': String(u), 'aria-pressed': 'false',
          'aria-label': dayName(d) + ' ' + fmt(u)
        })));
      });
      body.appendChild(tr);
    }
    table.appendChild(body);

    var fr = h('tr', null, h('th', { scope: 'row', text: t('Hours', 'کاتژمێر') }));
    order.forEach(function (d) { fr.appendChild(h('td', { 'data-foot': String(d), text: '0' })); });
    table.appendChild(h('tfoot', null, fr));

    /* painting: drag with a mouse, tap or press Enter otherwise */
    var painting = false, paintOn = true, skipClick = false;
    table.addEventListener('pointerdown', function (e) {
      var c = e.target.closest('.cell');
      if (!c || e.pointerType !== 'mouse' || e.button !== 0) return;
      e.preventDefault();
      undoSnapshot = null;
      painting = true; skipClick = true;
      paintOn = !cellFree(+c.dataset.day, +c.dataset.unit);
      setCell(+c.dataset.day, +c.dataset.unit, paintOn);
      refresh();
    });
    table.addEventListener('pointerover', function (e) {
      if (!painting) return;
      var c = e.target.closest('.cell');
      if (!c) return;
      setCell(+c.dataset.day, +c.dataset.unit, paintOn);
      refresh();
    });
    window.addEventListener('pointerup', function () {
      if (!painting) return;
      painting = false;
      setTimeout(function () { skipClick = false; }, 0);
    });
    table.addEventListener('click', function (e) {
      var c = e.target.closest('.cell'), d, uu;
      if (c) {
        if (skipClick) { skipClick = false; return; }
        d = +c.dataset.day; uu = +c.dataset.unit;
        setCell(d, uu, !cellFree(d, uu));
        refresh();
        return;
      }
      var dh = e.target.closest('.dayhead');
      if (dh) {
        d = +dh.getAttribute('data-day');
        var full = dayUnits(d) === lastUnit() - firstUnit();
        bulk(function () { setRange(d, firstUnit(), lastUnit(), !full); });
        if (full) say(t('Cleared ' + DAYS_EN[d] + '.', DAYS_KU[d] + ' سڕایەوە.'), true);
        else say(t('Selected all of ' + DAYS_EN[d] + '.', 'هەموو ' + DAYS_KU[d] + ' هەڵبژێردرا.'), true);
        return;
      }
      var hh = e.target.closest('.hourhead');
      if (hh) {
        uu = +hh.getAttribute('data-unit');
        var allOn = weekOrder().every(function (x) { return cellFree(x, uu); });
        bulk(function () { weekOrder().forEach(function (x) { setCell(x, uu, !allOn); }); });
        if (allOn) say(t('Cleared ' + fmt(uu) + ' on every day.', 'ئەم کاتژمێرە لە هەموو ڕۆژەکاندا سڕایەوە.'), true);
        else say(t('Selected ' + fmt(uu) + ' on every day.', 'ئەم کاتژمێرە لە هەموو ڕۆژەکاندا هەڵبژێردرا.'), true);
      }
    });

    refs.table = table;
    refs.total = h('p', { class: 'total' });
    refs.status = h('p', { class: 'status hold', role: 'status', 'aria-live': 'polite' });
    return h('section', { 'aria-label': t('Your week', 'هەفتەکەت') },
      refs.total,
      h('p', { class: 'legend' }, h('i'), t('Green: you can attend', 'سەوز: دەتوانیت بەشدار بیت')),
      refs.status,
      table,
      h('div', { class: 'row' },
        h('button', {
          class: 'btn', type: 'button', id: 'clear-week', text: t('Clear all', 'سڕینەوەی هەمووی'),
          onclick: function () {
            if (!free.size) { say(t('Nothing is selected.', 'هیچ کاتێک هەڵنەبژێردراوە.')); return; }
            bulk(function () { free = new Set(); });
            say(t('Cleared everything.', 'هەمووی سڕایەوە.'), true);
          }
        })));
  }

  /* ---------- name, notes and Submit ---------- */
  function applicationText() {
    var lines = ['AI Kurd – ' + cfg.title, 'Name: ' + personName.trim(), ''];
    weekOrder().forEach(function (d) {
      var n = dayUnits(d);
      lines.push(DAYS_EN[d] + ': ' + (n ? rangesText(d) + ' (' + (n / 2) + ' h)' : 'not free'));
    });
    lines.push('', 'Total: ' + (totalUnits() / 2) + ' h');
    if (notes.trim()) lines.push('', 'Note: ' + notes.trim());
    return lines.join('\n');
  }

  function problem() {
    if (!personName.trim()) return [t('Write your name first.', 'سەرەتا ناوەکەت بنووسە.'), 'your-name'];
    if (!totalUnits()) return [t('Select at least one hour in the table first.', 'سەرەتا لانیکەم یەک کاتژمێر لە خشتەکەدا هەڵبژێرە.'), null];

  function sendNote(text, alert) {

  function blocked(e) {
    var p = problem();
    if (!p) return false;
    if (e) e.preventDefault();

  function showCopyBox() {

  function copyForm() {

      refs.copyBox.focus(); refs.copyBox.select();
      sendNote(t('Copying is blocked here. The text is selected so you can copy it yourself.', 'کۆپیکردن لێرە ڕێگەپێنەدراوە. دەقەکە دیاری کراوە، خۆت کۆپیی بکە.'));
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        sendNote(t('Copied. Now paste it in a message to the course organizer.', 'کۆپی کرا. ئێستا لە نامەیەکدا بۆ ڕێکخەری خولەکە دایبنێ.'));
      }, manual);
    } catch (e) { manual(); }
  }

  /* ---------- the picture of the timetable that goes with the form ---------- */
  function drawPicture() {
    var W = 1200, pad = 48, hourW = 120, order = weekOrder(), s = step();
    var colW = (W - 2 * pad - hourW) / 7, rowH = (s === 1) ? 26 : 40, rows = (lastUnit() - firstUnit()) / s;
    var FONT = 'Poppins, Aria, "Segoe UI", Tahoma, sans-serif';
    var ink = '#F1F5F4', muted = '#9BA9A6', cellC = '#19211F', freeC = '#34C6A6';
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function loadLogo() {
      return new Promise(function (resolve) {
        if (!cfg.logo) { resolve(null); return; }
        var img = new Image();
        img.onload = function () { resolve(img); };
        img.onerror = function () { resolve(null); };
        img.src = cfg.logo;
      });
    }
    var fontsReady = Promise.resolve();
    try {
      fontsReady = Promise.race([
        Promise.all([document.fonts.load('600 20px Poppins'), document.fonts.load('700 20px Poppins'), document.fonts.load('600 20px Aria', 'کورد')]),
        wait(1500)
      ]).catch(function () { /* draw with what is there */ });
    } catch (e) { /* ignore */ }

    return Promise.all([loadLogo(), fontsReady]).then(function (r) {
      var logo = r[0];
      var probe = document.createElement('canvas').getContext('2d');
      probe.font = '400 22px ' + FONT;
      var noteLines = [];
      if (notes.trim()) {
        var words = ('Note: ' + notes.trim().replace(/\s+/g, ' ')).split(' '), line = '';
        words.forEach(function (w) {
          var tryLine = line ? line + ' ' + w : w;
          if (probe.measureText(tryLine).width > W - 2 * pad && line) { noteLines.push(line); line = w; }
          else line = tryLine;
        });
        if (line) noteLines.push(line);
        if (noteLines.length > 8) { noteLines = noteLines.slice(0, 8); noteLines[7] += ' …'; }
      }
      var headTop = 300, gridTop = headTop + 44;
      var H = gridTop + rows * rowH + 60 + (noteLines.length ? 30 + noteLines.length * 32 : 0) + pad;
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var c = cv.getContext('2d');
      c.fillStyle = '#000000'; c.fillRect(0, 0, W, H);
      c.textBaseline = 'middle';

      if (logo) { var lh = 84, lw = logo.naturalWidth * lh / logo.naturalHeight; c.drawImage(logo, pad, pad, lw, lh); }
      else { c.fillStyle = ink; c.font = '700 40px ' + FONT; c.textAlign = 'left'; c.fillText('AI Kurd', pad, pad + 42); }

      c.textAlign = 'left'; c.fillStyle = muted; c.font = '500 22px ' + FONT;
      c.fillText(cfg.title, pad, 176);
      c.fillStyle = ink; c.font = '700 40px ' + FONT;
      c.fillText(personName.trim(), pad, 222, W - 2 * pad);
      var now = new Date();
      function two(n) { return (n < 10 ? '0' : '') + n; }
      var stamp = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate()) + ' ' + two(now.getHours()) + ':' + two(now.getMinutes());
      c.fillStyle = muted; c.font = '500 22px ' + FONT;
      c.fillText('Free ' + (totalUnits() / 2) + ' h this week  ·  sent ' + stamp, pad, 270);

      c.textAlign = 'center'; c.font = '600 20px ' + FONT;
      order.forEach(function (d, i) {
        c.fillStyle = (dayUnits(d) === lastUnit() - firstUnit()) ? freeC : ink;
        c.fillText(DAYS_EN[d], pad + hourW + colW * i + colW / 2, headTop + 20);
      });
      for (var ri = 0; ri < rows; ri++) {
        var u = firstUnit() + ri * s, y = gridTop + ri * rowH;
        if (u % 2 === 0) {
          c.textAlign = 'right'; c.fillStyle = muted; c.font = '500 18px ' + FONT;
          c.fillText(fmt(u), pad + hourW - 14, y + rowH / 2);
        }
        order.forEach(function (d, i) {
          c.fillStyle = cellFree(d, u) ? freeC : cellC;
          var x = pad + hourW + colW * i;
          c.beginPath();
          if (c.roundRect) c.roundRect(x + 2, y + 2, colW - 4, rowH - 4, 5); else c.rect(x + 2, y + 2, colW - 4, rowH - 4);
          c.fill();
        });
      }
      var fy = gridTop + rows * rowH + 28;
      c.textAlign = 'right'; c.fillStyle = muted; c.font = '500 18px ' + FONT;
      c.fillText('Hours', pad + hourW - 14, fy);
      c.textAlign = 'center'; c.font = '600 20px ' + FONT;
      order.forEach(function (d, i) {
        var n = dayUnits(d);
        c.fillStyle = n ? ink : muted;
        c.fillText(String(n / 2), pad + hourW + colW * i + colW / 2, fy);
      });
      if (noteLines.length) {
        c.textAlign = 'left'; c.fillStyle = ink; c.font = '400 22px ' + FONT;
        noteLines.forEach(function (ln, i) { c.fillText(ln, pad, fy + 60 + i * 32); });
      }
      return new Promise(function (resolve) {
        try { cv.toBlob(function (b) { resolve(b); }, 'image/png'); } catch (e) { resolve(null); }
      });
    }).catch(function () { return null; });
  }

  // On a website: one press sends the form, with the picture attached, to the organizer's email.
  function sendForm(btn) {
    if (blocked()) return;
    btn.disabled = true;
    sendNote(t('Sending…', 'خەریکی ناردنە…'));
    drawPicture().then(function (blob) {
      var f = h('form', { method: 'POST', action: 'https://formsubmit.co/' + cfg.email, enctype: 'multipart/form-data', hidden: true, 'accept-charset': 'UTF-8' });
      function add(name, value) { f.appendChild(h('input', { type: 'hidden', name: name, value: value })); }
      add('_subject', 'Time availability: ' + personName.trim());
      add('_template', 'table');
      add('_captcha', 'false');
      add('_next', location.origin + location.pathname + '?sent=1');
      add('Name', personName.trim());
      add('Total', (totalUnits() / 2) + ' h');
      weekOrder().forEach(function (d) {
        var n = dayUnits(d);
        add(DAYS_EN[d], n ? rangesText(d) + ' (' + (n / 2) + ' h)' : 'not free');
      });
      if (notes.trim()) add('Note', notes.trim());
      f.appendChild(h('input', { type: 'text', name: '_honey', value: '' }));
      if (blob) {
        try {
          var dt = new DataTransfer();
          dt.items.add(new File([blob], 'AI-Kurd-timetable.png', { type: 'image/png' }));
          var fi = h('input', { type: 'file', name: 'attachment' });
          fi.files = dt.files;
          f.appendChild(fi);
        } catch (e) { /* older browsers: the form still goes, without the picture */ }
      }
      document.body.appendChild(f);
      f.submit();
    });
  }

            showCopyBox();
            sendNote(t('Your form is ready below. Copy it and send it to the course organizer.',
              'فۆرمەکەت لە خوارەوە ئامادەیە. کۆپیی بکە و بینێرە بۆ ڕێکخەری خولەکە.'));
          }
        }));
      } else {
        refs.actions.appendChild(h('button', {
          class: 'btn link', type: 'button', id: 'show-text', text: t('Show my form as text', 'پیشاندانی فۆرمەکەم وەک دەق'),
          onclick: function () {
            if (blocked()) return;
            showCopyBox();
            sendNote(t('You can also copy the text and send it yourself.', 'دەتوانیت دەقەکە کۆپی بکەیت و خۆت بینێریت.'));
          }
        }));
      }
    }

    return h('section', { 'aria-label': t('Your details', 'زانیارییەکانت') },
      h('div', { class: 'field' },
        h('label', { class: 'flabel', for: 'your-name', text: t('Full name', 'ناوی تەواو') }),
        nameInput),
      h('div', { class: 'field' },
        h('label', { class: 'flabel', for: 'your-notes', text: t('Anything else we should know?', 'هەر شتێکی تر کە پێویستە بیزانین؟') }),
        h('p', { class: 'muted small', text: t('Extra details about your time, something urgent, or anything else.', 'وردەکاریی زیاتر دەربارەی کاتەکانت، شتێکی بەپەلە، یان هەر شتێکی تر.') }),
        noteInput),
      refs.ownerNote,
      refs.actions,
      refs.sendNote,
      refs.copyBox,
      refs.copyRow);
  }

  function syncLinks() {
    if (!refs.links) return;
    var list = channels();
    refs.links.forEach(function (l) {
      var ch = list.filter(function (x) { return x.id === l.id; })[0];
      if (ch) l.el.href = ch.url;
    });
    if (refs.copyBox && !refs.copyBox.hidden) refs.copyBox.value = applicationText();
  }

  /* ---------- redraw everything that depends on the answers ---------- */
  function refresh() {
    var total = 0, span = lastUnit() - firstUnit();
    refs.table.querySelectorAll('.cell').forEach(function (c) {
      c.setAttribute('aria-pressed', String(cellFree(+c.dataset.day, +c.dataset.unit)));
    });
    weekOrder().forEach(function (d) {
      var n = dayUnits(d); total += n;
      var foot = refs.table.querySelector('[data-foot="' + d + '"]');
      foot.textContent = String(n / 2);
      foot.className = n ? 'has' : '';
      refs.table.querySelector('.dayhead[data-day="' + d + '"]').setAttribute('aria-pressed', String(n === span));
    });
    refs.total.textContent = total
      ? t((total / 2) + ' hours selected', (total / 2) + ' کاتژمێر هەڵبژێردراوە')
      : t('No hours selected yet', 'هێشتا هیچ کاتێک هەڵنەبژێردراوە');
    syncLinks();
    saveAnswers();
  }

  /* ---------- editing the page (owner, inside Claude) ---------- */
  function use(name) {
    try { return (claude && claude.use) ? claude.use(name).catch(function () { return null; }) : Promise.resolve(null); }
    catch (e) { return Promise.resolve(null); }
  }
  var caps = { artifact: use('artifact'), user: use('user') };
  function syncOwnerUi() {
    if (refs.editBtn) refs.editBtn.hidden = !showEditButton || editOpen;
    if (refs.ownerNote) refs.ownerNote.hidden = !showEditButton || !!(cfg.whatsapp || cfg.telegram || cfg.email);
  }
  Promise.all([caps.artifact, caps.user]).then(function (r) {
    var artifact = r[0], user = r[1];
    var decide = user
      ? user.canEdit().catch(function () { return false; })
      : Promise.resolve(!!artifact);
    return decide.then(function (ok) { showEditButton = !!ok; syncOwnerUi(); });
  });

  function buildEditor() {
    function field(label, control, wide, hint) {
      return h('div', { class: 'field' + (wide ? ' wide' : '') },
        h('label', { class: 'label', for: control.id, text: label }), control,
        hint ? h('p', { class: 'muted small', text: hint }) : null);
    }
    function hourSelect(id, from, to, value) {
      var sel = h('select', { id: id }), hh;
      for (hh = from; hh <= to; hh++) sel.appendChild(h('option', { value: String(hh), text: fmt(hh * 2) }));
      sel.value = String(value);
      return sel;
    }
    function choice(id, options, value) {
      var sel = h('select', { id: id });
      options.forEach(function (o) { sel.appendChild(h('option', { value: o[0], text: o[1] })); });
      sel.value = value;
      return sel;
    }
    function area(id, value, rtl) {
      var a = h('textarea', { id: id, maxlength: '1500', rows: '6', dir: rtl ? 'rtl' : 'ltr', class: rtl ? 'kufont' : null });
      a.value = value;
      return a;
    }
    var note = h('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
    var title = h('input', { type: 'text', id: 'set-title', maxlength: '120', value: cfg.title });
    var titleKu = h('input', { type: 'text', id: 'set-title-ku', maxlength: '120', dir: 'rtl', class: 'kufont', value: cfg.titleKu });
    var howEn = area('set-how-en', cfg.howEn, false);
    var howKu = area('set-how-ku', cfg.howKu, true);
    var first = choice('set-lang', [['ku', 'Kurdish'], ['en', 'English']], cfg.lang);
    var start = hourSelect('set-start', 0, 23, cfg.startHour);
    var end = hourSelect('set-end', 1, 24, cfg.endHour);
    var slot = choice('set-slot', [['60', 'One hour'], ['30', 'Half an hour']], String(cfg.slot));
    var clock = choice('set-clock', [['12', '12-hour (9 AM)'], ['24', '24-hour (09:00)']], cfg.clock);
    var week = choice('set-week', DAYS_EN.map(function (n, i) { return [String(i), n]; }), String(cfg.weekStart));
    var wa = h('input', { type: 'text', id: 'set-whatsapp', inputmode: 'tel', maxlength: '24', value: cfg.whatsapp });
    var tg = h('input', { type: 'text', id: 'set-telegram', maxlength: '40', value: cfg.telegram });
    var mail = h('input', { type: 'text', id: 'set-email', inputmode: 'email', maxlength: '120', value: cfg.email });

    var logoData = cfg.logo;
    var preview = h('img', { class: 'logoprev', alt: 'Logo preview', hidden: !logoData });
    if (logoData) preview.src = logoData;
    var removeLogo = h('button', { class: 'btn', type: 'button', id: 'set-logo-remove', hidden: !logoData, text: 'Remove logo',
      onclick: function () { logoData = ''; preview.hidden = true; removeLogo.hidden = true; logoFile.value = ''; } });
    var logoFile = h('input', { type: 'file', id: 'set-logo', accept: 'image/*',
      onchange: function () {
        var f = logoFile.files && logoFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onerror = function () { note.textContent = 'That file could not be read. Try a PNG or JPG image.'; };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { note.textContent = 'That file is not an image the browser can open. Try a PNG or JPG.'; };
          img.onload = function () {
            var w = img.naturalWidth || 600, hgt = img.naturalHeight || 300;
            var k = Math.min(1, 640 / w, 320 / hgt);
            var cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(hgt * k));
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            var url = logoUrl(cv.toDataURL('image/png'));
            if (!url) { note.textContent = 'That image is too detailed to store in the page. Try a simpler or smaller logo file.'; return; }
            logoData = url; preview.src = url; preview.hidden = false; removeLogo.hidden = false;
            note.textContent = 'Logo ready. Press Save changes to put it on the page.';
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      } });

    var saveBtn = h('button', { class: 'btn primary', type: 'submit', id: 'set-save', text: 'Save changes' });
    var form = h('form', { class: 'panel edit', 'aria-labelledby': 'h-edit', novalidate: true, dir: 'ltr', lang: 'en' },
      h('h2', { id: 'h-edit', text: 'Edit this page' }),
      h('div', { class: 'formgrid' },
        h('div', { class: 'field wide' }, h('label', { class: 'label', for: 'set-logo', text: 'Logo' }),
          h('div', { class: 'row' }, preview, logoFile, removeLogo)),
        field('Heading (English)', title, true),
        field('Heading (Kurdish)', titleKu, true),
        field('Explanation (English), one step per line', howEn, true),
        field('Explanation (Kurdish), one step per line', howKu, true),
        field('Page opens in', first),
        field('First hour shown', start),
        field('Day ends at', end),
        field('Each block is', slot),
        field('Clock', clock),
        field('Week starts on', week)),
      h('h2', { text: 'Where Submit sends the form' }),
      h('p', { class: 'muted small', text: 'On this Claude page, Submit opens that app with the applicant’s form already written to you and they press Send. Applicants can see the contact you put here.' }),
      h('div', { class: 'formgrid' },
        field('WhatsApp number', wa, false, 'With country code, for example 9647501234567.'),
        field('Telegram username', tg, false, 'For example aikurd, without @.'),
        field('Email address', mail, false, 'Opens a new email to you with the form filled in.')),
      h('div', { class: 'row' }, saveBtn,
        h('button', { class: 'btn', type: 'button', id: 'set-cancel', text: 'Cancel', onclick: function () { editOpen = false; render(); } })),
      note);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (+end.value <= +start.value) { note.textContent = 'The day has to end after the first hour shown.'; end.focus(); return; }
      if (wa.value.trim() && !waNumber(wa.value)) { note.textContent = 'The WhatsApp number does not look complete. Use digits with the country code, like 9647501234567.'; wa.focus(); return; }
      if (tg.value.trim() && !tgUser(tg.value)) { note.textContent = 'The Telegram username does not look right. Use the name after @, like aikurd.'; tg.focus(); return; }
      if (mail.value.trim() && !mailAddr(mail.value)) { note.textContent = 'The email address does not look right.'; mail.focus(); return; }
      var next = clean({
        rev: BASE.rev + 1, lang: first.value, title: title.value, titleKu: titleKu.value, howEn: howEn.value, howKu: howKu.value,
        startHour: +start.value, endHour: +end.value, slot: +slot.value, weekStart: +week.value, clock: clock.value,
        whatsapp: wa.value, telegram: tg.value, email: mail.value, logo: logoData
      });
      saveBtn.disabled = true;
      note.textContent = 'Saving…';
      caps.artifact.then(function (artifact) {
        if (!artifact) { applyHere(next, 'Saving for everyone is not available in this view, so the changes show here only until the page reloads.'); return; }
        artifact.publish(buildPage(next)).then(function () {
          note.textContent = 'Saved. The page is reloading with your changes.';
        }, function (err) {
          var code = err && err.code;
          saveBtn.disabled = false;
          if (code === 'conflict') { note.textContent = 'A newer version was just saved. The page is reloading to it.'; return; }
          if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' ||
              code === 'capability_disabled' || code === 'capability_removed') {
            applyHere(next, 'You can view this page but not change it for everyone. The changes show here only until the page reloads.');
            return;
          }
          if (code === 'too_large') { note.textContent = 'The page is too large to save. Use a smaller logo file.'; return; }
          if (code === 'rate_limited') { note.textContent = 'Too many saves in a short time. Wait a minute, then save again.'; return; }
          note.textContent = 'The page could not be saved just now. Try again in a moment.';
        });
      });
    });
    return form;
  }

  function applyHere(next, message) {
    next.rev = BASE.rev;
    cfg = next;
    editOpen = false;
    render();
    say(message);
  }

  // Rebuild the whole page from its settings, in the same shape it was first published.
  function buildPage(next) {
    var close = '<' + '/script>';
    var json = JSON.stringify(next).replace(/</g, '\\u003c');
    var css = document.getElementById('page-css').textContent;
    var code = document.getElementById('app-code').textContent;
    var reset = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}' +
      'html{scroll-padding-top:env(safe-area-inset-top,0px)}' +
      'body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}' +
      'img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
    return '<!doctype html><html><head><meta charset=utf8>' +
      '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<style>' + reset + '</style></head><body>\n' +
      '<title>Weekly Availability</title>\n' +
      '<link rel="stylesheet" href="' + FONT_HREF + '">\n' +
      '<style id="page-css">' + css + '</style>\n' +
      '<div id="app" class="wrap"></div>\n' +
      '<script type="application/json" id="page-config">' + json + close + '\n' +
      '<script id="app-code">' + code + close + '\n' +
      '</body></html>';
  }

  // Coming back with the Back button after sending: show a fresh page, not a disabled button.
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });

  render();
})();
</script>

</body>
